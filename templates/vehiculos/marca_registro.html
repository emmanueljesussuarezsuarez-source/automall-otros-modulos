{% extends "base.html" %}

{% block content %}
<!-- Estilos de DataTables con Bootstrap 5 -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">

<div class="container-fluid mt-4">
    <div class="row">
        
        <!-- COLUMNA IZQUIERDA: FORMULARIO -->
        <div class="col-md-4 mb-4">
            <div class="card shadow border-0" style="border-radius: 10px;">
                <div class="card-header bg-primary text-white p-3" style="border-radius: 10px 10px 0 0;">
                    <h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Nueva Marca</h5>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('marcas.registro_marca') }}" method="POST" id="formMarca">
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre de la Marca</label>
                            <input type="text" id="nombre_marca" name="nombre_marca" class="form-control" placeholder="Ej: Toyota..." required>
                        </div>

                        <!-- Campo oculto para que siempre se registre como Activo -->
                        <input type="hidden" name="estado" value="Activo">

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success shadow-sm">
                                <i class="bi bi-save me-1"></i> Guardar Marca
                            </button>
                            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: TABLA DE LISTADO -->
        <div class="col-md-8 mb-4">
            <div class="card shadow border-0" style="border-radius: 10px;">
                <div class="card-header bg-dark text-white p-3" style="border-radius: 10px 10px 0 0;">
                    <h5 class="mb-0"><i class="bi bi-list-ul me-2"></i>Marcas Registradas</h5>
                </div>
                <div class="card-body p-3">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 nowrap" id="tablaMarcas" style="width:100%;">
                            <thead class="table-light text-secondary">
                                <tr>
                                    <th class="ps-4">ID</th>
                                    <th>Nombre</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for marca in marcas %}
                                <tr>
                                    <td class="ps-4">
                                        <span class="text-muted fw-bold">{{ marca.cod_marca }}</span>
                                    </td>
                                    <td class="fw-bold text-dark">{{ marca.nombre_marca }}</td>
                                    <td class="text-center">
                                        <div class="btn-group">
                                            <!-- BOTÓN EDITAR -->
                                            <button type="button" class="btn btn-sm btn-outline-primary me-1 btn-editar-marca" 
                                                    data-id="{{ marca.cod_marca }}"
                                                    data-nombre="{{ marca.nombre_marca }}"
                                                    title="Editar">
                                                <i class="bi bi-pencil"></i>
                                            </button>

                                            <!-- BOTÓN ELIMINAR -->
                                            <button type="button" class="btn btn-sm btn-outline-danger btn-eliminar-marca" 
                                                    data-id="{{ marca.cod_marca }}"
                                                    title="Eliminar">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- MODAL PARA EDITAR MARCA -->
<div class="modal fade" id="modalEditarMarca" tabindex="-1" aria-labelledby="modalEditarMarcaLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow">
            <form id="formEditarMarca" method="POST">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalEditarMarcaLabel"><i class="bi bi-pencil-square me-2"></i>Editar Marca</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre de la Marca</label>
                        <input type="text" name="nombre_marca" id="edit_nombre_marca" class="form-control" required>
                    </div>
                    
                    <!-- Campo oculto para mantener el estado como Activo al editar -->
                    <input type="hidden" name="estado" id="edit_estado_marca" value="Activo">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- LIBRERÍAS DE DATATABLES, SWEETALERT Y ARCHIVOS JS -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{{ url_for('static', filename='js/marca.js') }}"></script>

{% endblock %}
