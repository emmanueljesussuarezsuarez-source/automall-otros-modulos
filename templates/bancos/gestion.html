{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-bank text-primary me-2"></i> Gestión de Bancos</h2>
        <button class="btn btn-primary" onclick="abrirModalCrear()">
            <i class="bi bi-plus-circle me-1"></i> Nuevo Banco
        </button>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Nombre del Banco</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for b in bancos %}
                    <tr>
                        <td>{{ b.cod_banco }}</td>
                        <td>{{ b.nombre_banco }}</td>
                        <td>
                            <span class="badge {% if b.estado == 'Activo' %}bg-success{% else %}bg-danger{% endif %}">
                                {{ b.estado }}
                            </span>
                        </td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary" 
                                    onclick="abrirModalEditar('{{ b.cod_banco }}', '{{ b.nombre_banco }}', '{{ b.estado }}')">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="eliminarBanco('{{ b.cod_banco }}')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal para Crear/Editar -->
<div class="modal fade" id="modalBanco" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitulo">Nuevo Banco</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="formBanco" onsubmit="guardarBanco(event)">
                <div class="modal-body">
                    <!-- URL dinámica para Fetch -->
                    <input type="hidden" id="url_destino" value="">
                    
                    <div class="mb-3">
                        <label class="form-label">Nombre del Banco</label>
                        <input type="text" class="form-control" id="nombre_banco" name="nombre_banco" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Estado</label>
                        <select class="form-select" id="estado" name="estado">
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/crud_gestion.js') }}"></script>
<script src="{{ url_for('static', filename='js/banco.js') }}"></script>
{% endblock %}
