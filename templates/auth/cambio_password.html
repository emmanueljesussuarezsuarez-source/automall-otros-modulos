{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card auth-card border-0 p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-key-fill text-primary" style="font-size: 2.5rem;"></i>
                    <h3 class="fw-bold mt-2">Cambiar contraseña</h3>
                    <p class="text-muted mb-0">Ingresa una nueva contraseña segura</p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} small py-2 text-start">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form id="form-cambio-password" action="{{ url_for('auth.cambiar_password') }}" method="POST" novalidate>
                    <div class="mb-3">
                        <label for="nueva_password" class="form-label">Nueva contraseña</label>
                        <input type="password" id="nueva_password" name="nueva_password" class="form-control auth-control" placeholder="Escribe tu nueva contraseña" required autocomplete="new-password">
                        <div id="error-nueva-password" class="text-danger small mt-1"></div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmar_password" class="form-label">Confirmar contraseña</label>
                        <input type="password" id="confirmar_password" name="confirmar_password" class="form-control auth-control" placeholder="Repite tu nueva contraseña" required autocomplete="new-password">
                        <div id="error-confirmar-password" class="text-danger small mt-1"></div>
                    </div>

                    <button type="submit" class="btn btn-registrar w-100 py-2">Guardar contraseña</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/validar_recuperacion.js') }}"></script>
{% endblock %}
