{% extends "base.html" %}

{% block title %}Editar Proveedor{% endblock %}

{% block content %}
<div class="container mt-4">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flask-msg-data" data-message="{{ message }}" data-category="{{ category }}" style="display:none;"></div>
        {% endfor %}
    {% endwith %}

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-warning">
                    <h4 class="mb-0"><i class="bi bi-pencil-square"></i> Editar Proveedor</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">RIF / Cédula (no editable)</label>
                            <input type="text" class="form-control bg-light"
                                   value="{{ proveedor.rif_cedula_proveedor }}" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Razón Social *</label>
                            <input type="text" name="razon_social" class="form-control"
                                   value="{{ proveedor.razon_social }}" required maxlength="250">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Dirección *</label>
                            <textarea name="direccion" class="form-control" rows="2"
                                      required>{{ proveedor.direccion }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono *</label>
                            <input type="text" name="telefono" class="form-control"
                                   value="{{ proveedor.telefono }}" required pattern="[0-9]+" title="Solo números">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo *</label>
                            <input type="email" name="correo" class="form-control"
                                   value="{{ proveedor.correo }}" required maxlength="50">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Estado</label>
                            <select name="estado" class="form-select">
                                <option value="Activo"   {% if proveedor.estado == 'Activo'   %}selected{% endif %}>Activo</option>
                                <option value="Inactivo" {% if proveedor.estado == 'Inactivo' %}selected{% endif %}>Inactivo</option>
                            </select>
                        </div>
                        <div class="text-end">
                            <a href="{{ url_for('compras.listar_proveedores') }}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-save"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const iconMap = { success:'success', danger:'error', warning:'warning', info:'info', message:'info' };

    document.querySelectorAll('.flask-msg-data').forEach(el => {
        const msg = el.dataset.message;
        const cat = (el.dataset.category || 'info').toLowerCase();
        if (!msg) return;
        Swal.fire({
            icon: iconMap[cat] || 'info',
            title: msg,
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3500,
            timerProgressBar: true
        });
    });
});
</script>
{% endblock %}
