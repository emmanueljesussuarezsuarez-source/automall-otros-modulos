{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h3 class="fw-bold mb-4">
                        {% if taller %}Editar Taller{% else %}Registrar Taller{% endif %}
                    </h3>

                    <form method="POST" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="nombre_taller">Nombre del Taller</label>
                            <input type="text" id="nombre_taller" name="nombre_taller" class="form-control"
                                   value="{{ taller.nombre_taller if taller else '' }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="direccion">Dirección</label>
                            <textarea id="direccion" name="direccion" class="form-control" rows="3">{{ taller.direccion if taller else '' }}</textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                {% if taller %}Actualizar{% else %}Guardar{% endif %}
                            </button>
                            <a href="{{ url_for('tallerbp.listar_talleres') }}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="{{ url_for('static', filename='js/validar_taller.js') }}"></script>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
        <script>
            Swal.fire({
                icon: "{{ 'error' if category == 'danger' else category }}",
                title: "{{ 'Error' if category == 'danger' else category|capitalize }}",
                text: "{{ message }}",
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true
            });
        </script>
        {% endfor %}
    {% endif %}
{% endwith %}
{% endblock %}
